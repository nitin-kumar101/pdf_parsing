[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omniparse-docs"
version = "0.1.0"
description = "Modular document parsing with optional OCR and agent integrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24", "pydantic>=2.0", "typer>=0.12"]

[project.optional-dependencies]
mineru = ["mineru>=4.0,<5"]
textract = ["boto3>=1.34"]
office = ["python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "beautifulsoup4>=4.12"]
all = ["boto3>=1.34", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0", "beautifulsoup4>=4.12"]

[project.scripts]
omniparse = "omniparse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/omniparse"]
